<!DOCTYPE html>
<html>
	<!-- 实现点赞和取消点赞功能：
			点击按钮发生图标和点赞数的改变
	 -->
	<head>
		<meta charset="utf-8">
		<title>原生JS复习</title>
		<style>
			#likeCard {
				width: 60px;
				padding: 10px;
				display: flex;
				align-items: center;
				justify-content: space-evenly;
				border: 1px solid #7e7e7e;
				border-radius: 10px;
			}
			#likeIcon {
				width: 20px;
			}
			#likeCount {
				color: #6d6d6d;
			}
		</style>
	</head>
	<body>
		<div id="likeCard">
			<img id="likeIcon" src="./dianzan.png" />
			<span id="likeCount">20</span>
		</div>
	</body>
</html>
